#
####################################################
#                                                  #
#         -------Quillnote-Server-------           #
#                                                  #
####################################################
#
# self build docker contianer from
#
# https://github.com/arunk140/quillnote-server
#
# git clone https://github.com/arunk140/quillnote-server.git
# cd quillnote-server
#
# docker build -f "Dockerfile" -t quillnoteserver:latest "."
#
# ssh into container and then execute:
# ./server user add [username] [password]
#
  quillnote-server:
    container_name: quillnote-server
    hostname: quillnote-server
    restart: $RESTART_POLICY
    privileged: true
    environment:
      - PUID=$PUID
      - PGID=$PGID
    volumes:
      - $PERSIST/quillnote-server/notes.db:/app/notes.db
    networks:
      my_bridge:
    ports:
      - 3020:3000
    cap_add:
      - NET_ADMIN
    labels: 
      diun.enable: false
      com.centurylinklabs.watchtower.enable: false
    image: 'quillnoteserver:local'
#
####################################################
#                                                  #
#                -------QRcode-------              #
#                                                  #
####################################################
#
  qrcode:
    container_name: qrcode
    restart: $RESTART_POLICY
    hostname: qrcode
    networks:
      my_bridge:
    ports:
      - 8895:80
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
    labels: 
      autoheal: $AUTOHEAL_RESTART
    security_opt:
      - no-new-privileges:true
    image: 'bizzycolah/qrcode-generator:latest'
#
####################################################
#                                                  #
#               -------Radarr-------               #
#                                                  #
####################################################
#
  radarr:
    container_name: radarr
    restart: $RESTART_POLICY
    hostname: radarr
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $PERSIST/radarr/config:/config
      - $MEDIA_PATH/Movies/English:/movies #optional
      - $DOWNLOADS:/downloads #optional
    ports:
      - 7878:7878
    networks:
      my_bridge:
    depends_on:
      prowlarr:
          condition: service_started
      transmission:
          condition: service_started
      radarr-postgres:
          condition: service_healthy
    image: 'lscr.io/linuxserver/radarr:latest'
#
####################################################
#                                                  #
#          -------Radarr-Postgres-------           #
#                                                  #
####################################################
#
  radarr-postgres:
    container_name: radarr-postgres
    hostname: radarr-postgres
    restart: $RESTART_POLICY
    environment:
      POSTGRES_DB: radarr
      POSTGRES_USER: radarruser
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - $PERSIST/radarr/db:/var/lib/postgresql:rw
    networks:
      my_bridge:
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "radarr", "-U", "radarruser"]
      timeout: 45s
      interval: 10s
      retries: 10
    image: 'postgres:18-alpine'
#
####################################################
#                                                  #
#                 -------Seerr-------              #
#                                                  #
####################################################
#
  seerr:
    container_name: seerr
    restart: $RESTART_POLICY
    hostname: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=$TZ
      - PORT=5055 #optional
      - DB_TYPE=postgres # Which DB engine to use, either sqlite or postgres. The default is sqlite.
      - DB_HOST=seerr-postgres
      - DB_PORT=5432
      - DB_USER=seerruser
      - DB_PASS=$DB_PASSWORD
      - DB_NAME=seerr
      - DB_LOG_QUERIES=false # (optional) Whether to log the DB queries for debugging. The default is "false".
    volumes:
      - $PERSIST/seerr/config:/app/config
    ports:
      - 5055:5055
    networks:
      my_bridge:
    init: true
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    depends_on:
      transmission:
          condition: service_started
      sonarr:
          condition: service_started
      radarr:
          condition: service_started
      seerr-postgres:
          condition: service_healthy
    image: 'ghcr.io/seerr-team/seerr:latest'
#
####################################################
#                                                  #
#          -------Seerr-Postgres-------            #
#                                                  #
####################################################
#
  seerr-postgres:
    container_name: seerr-postgres
    hostname: seerr-postgres
    restart: $RESTART_POLICY
    environment:
      POSTGRES_DB: seerr
      POSTGRES_USER: seerruser
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - $PERSIST/seerr/db:/var/lib/postgresql:rw
    networks:
      my_bridge:
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "seerr", "-U", "seerruser"]
      timeout: 45s
      interval: 10s
      retries: 10
    image: 'postgres:18-alpine'
#
####################################################
#                                                  #
#           -------SMTP-To-Gotify-------           #
#                                                  #
####################################################
#
  smtp-to-gotify:
    container_name: smtp-to-gotify
    hostname: smtp-to-gotify
    restart: $ALWAYS_ON_POLICY
    environment:
    - GOTIFY_URL=$HTTPS_GOTIFY_URL
    - GOTIFY_TOKEN=$GOTIFY_SYNOLOGY_TOKEN
    - API_KEY=$APP_KEY
    network_mode: "host"
    ports:
      - 2525:2525
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    depends_on:
      gotify:
        condition: service_healthy
    image: 'imoshtokill/smtp-to-gotify-docker:latest'
#
####################################################
#                                                  #
#             -------Socket-Proxy-------           #
#                                                  #
####################################################
#
  socket:
    container_name: socketproxy
    restart: $ALWAYS_ON_POLICY
    hostname: socketproxy
    environment:
        PUID: $PUID
        PGID: $PGID
        LOG_LEVEL: err # debug,info,notice,warning,err,crit,alert,emerg
        ## Variables match the URL prefix (i.e. AUTH blocks access to /auth/* parts of the API, etc.).
        # 0 to revoke access.
        # 1 to grant access.
        ## Granted by Default
        EVENTS: 1
        PING: 1
        VERSION: 1
        ## Revoked by Default
        # Security critical
        AUTH: 0
        SECRETS: 0
        POST: 1 # HA, Watchtower
        # Not always needed
        BUILD: 1 # HA
        COMMIT: 1 # HA
        CONFIGS: 1 # HA
        CONTAINERS: 1 # HA, Container-Mon, Portainer
        DISTRIBUTION: 1 #HA
        EXEC: 1 # HA, ContainerWebTTy
        IMAGES: 1 # HA, Portainer, Container-Mon
        INFO: 1 # HA, Portainer
        NETWORKS: 1 # HA, Portainer
        NODES: 1 # HA
        PLUGINS: 1 # HA
        SERVICES: 1 # HA, Portainer
        SESSION: 1 # HA
        SWARM: 1 # HA
        SYSTEM: 0
        TASKS: 1 # Portainer
        VOLUMES: 1 # Portainer
    volumes:
        - $DOCKER_SOCKET:/var/run/docker.sock
        - /dev/log:/dev/log
    ports:
        - 2375:2375
    network_mode: host
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    privileged: true
    image: 'ghcr.io/tecnativa/docker-socket-proxy:latest' #'tecnativa/docker-socket-proxy:latest'
#
####################################################
#                                                  #
#               -------Sonarr-------               #
#                                                  #
####################################################
#
  sonarr:
    container_name: sonarr
    restart: $RESTART_POLICY
    hostname: sonarr
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $PERSIST/sonarr/config:/config
      - $MEDIA_PATH/Shows/English:/tv #optional
    ports:
      - 8989:8989
    networks:
      my_bridge:
    depends_on:
      prowlarr:
          condition: service_started
      transmission:
          condition: service_started
      sonarr-postgres:
