# version: '3'

# name: $STACK_NAME

networks:

# Bridge Network
  my_bridge:
    name: my_bridge
    driver: bridge
    attachable: true
    ipam:
      config:
        - subnet: $BRIDGE_SUBNET
          gateway: $BRIDGE_GATEWAY

# MacVLAN Network
  dockervlan:
    name: dockervlan
    driver: macvlan
    driver_opts:
      parent: $ETHCARD
      macvlan_mode: bridge
    ipam:
      config:
        - subnet: "$SUBNET"
          gateway: "$MACVLAN_GATEWAY"
          ip_range: "$MACVLAN_RANGE"


services:
#
####################################################
#                                                  #
#              -------AppRise-------               #
#                                                  #
####################################################
#
# http://192.168.1.10:8001/cfg/<APP_NAME>
# pover://{user_key}@{token}
#
  apprise:
    container_name: apprise-api
    restart: $ALWAYS_ON_POLICY
    hostname: apprise
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    networks:
      my_bridge:
    ports:
      - 8001:8000
    volumes:
      - $PERSIST/apprise:/config
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    image: 'lscr.io/linuxserver/apprise-api:latest'
#
####################################################
#                                                  #
#                  AudioBookShelf                  #
#                                                  #
####################################################
#
  audiobookshelf:
    container_name: audiobookshelf
    restart: $RESTART_POLICY
    hostname: audiobookshelf
    environment:
      - TZ=$TZ
    volumes:
      - $MEDIA_PATH/AudioBooks:/audiobooks
      - $MEDIA_PATH/Podcasts:/podcasts
      - $PERSIST/audiobookshelf/config:/config
      - $PERSIST/audiobookshelf/metadata:/metadata
    ports:
      - 13378:80
    networks:
      my_bridge:
    image: 'ghcr.io/advplyr/audiobookshelf:latest'
# 
#####################################################
#                                                  #
#              -------Authelia-------              #
#                                                  #
####################################################
#
  authelia:
    container_name: authelia    
    restart: $ALWAYS_ON_POLICY
    hostname: authelia
    environment:
      - TZ=$TZ
    volumes:
      - $PERSIST/authelia/config:/config
      - $PERSIST/authelia/log:/var/log/authelia
      - $PERSIST/authelia/assets:/etc/authelia/assets
    ports:
      - 9091:9091
    networks:
      my_bridge:
    healthcheck:
      disable: true
    depends_on:
      authelia-redis:
        condition: service_started
      # - mariadb #enable if using mariadb in config.yaml
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    logging:
      driver: loki
      options:
        loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    image: 'authelia/authelia:latest'
#
####################################################
#                                                  #
#           -------Authelia-Redis-------           #
#                                                  #
####################################################
#
  authelia-redis:
    container_name: authelia-redis
    restart: $ALWAYS_ON_POLICY
    hostname: authelia-redis
    environment:
      - TZ=$TZ
    volumes:
      - $PERSIST/authelia/redis:/data
    expose:
      - 6379
    networks:
      my_bridge:
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 5s
      retries: 2
    labels: 
      autoheal: $AUTOHEAL_RESTART
      monocker.enable: $MONOCKER_ENABLE
    image: 'redis:alpine'
#
####################################################
#                                                  #
#                -------Bazarr-------              #
#                                                  #
####################################################
#
  bazarr:
    container_name: bazarr
    restart: $RESTART_POLICY
    hostname: bazarr
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - POSTGRES_ENABLED=true
      - POSTGRES_HOST=bazarr-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=bazarr
      - POSTGRES_USERNAME=bazarruser
      - POSTGRES_PASSWORD=$DB_PASSWORD
    volumes:
      - $PERSIST/bazarr/config:/config
      - $MEDIA_PATH/Movies/English:/movies #optional
      - $MEDIA_PATH/Shows/English:/tv #optional
    ports:
      - 6767:6767
    networks:
      MY_bridge:
    depends_on:
      bazarr-postgres:
          condition: service_healthy
    image: 'lscr.io/linuxserver/bazarr:latest' #'ghcr.io/lavx/bazarr:2.4.0'
#
####################################################
#                                                  #
#          -------Bazarr-Postgres-------           #
#                                                  #
####################################################
#
  bazarr-postgres:
    container_name: bazarr-postgres
    hostname: bazarr-postgres
    restart: $RESTART_POLICY
    environment:
      POSTGRES_DB: bazarr
      POSTGRES_USER: bazarruser
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - $PERSIST/bazarr/db:/var/lib/postgresql:rw
    networks:
      My_bridge:
    labels: 
      com.centurylinklabs.watchtower.enable: false
      com.centurylinklabs.watchtower.monitor-only: true
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "bazarr", "-U", "bazarruser"]
      timeout: 45s
      interval: 10s
      retries: 10
    image: 'postgres:18-alpine'
#
####################################################
#                                                  #
#              -------Checkrr-------               #
#                                                  #
####################################################
#
  checkrr:
    container_name: checkrr
    restart: $RESTART_POLICY
    hostname: checkrr
    volumes:
      - $PERSIST/checkrr/checkrr.yaml:/etc/checkrr.yaml
      - $PERSIST/checkrr/checkrr.db:/checkrr.db
      - $MEDIA_PATH:/media
    ports:
      - 8585:8585
    networks:
      My_bridge:
    image: 'aetaric/checkrr:latest'
#
####################################################
#                                                  #
#             -------CloudFlared-------            #
#                                                  #
####################################################
#
  cloudflared:
    container_name: cloudflared
    restart: $ALWAYS_ON_POLICY
    hostname: cloudflared
    user: root
    environment:
      - NO_AUTOUPDATE=true
      - TUNNEL_TOKEN=$MINI_TUNNEL_TOKEN
    # network_mode: "host" # I use host networking because I want to tunnel a specific port opened on my host system
    networks:
      my_bridge:
        #  ipv4_address: $BRIDGE_NET.201
    command: 'tunnel --no-autoupdate run' # 'tunnel --config /etc/tunnel/config.yml run' 
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    image: 'cloudflare/cloudflared:latest'
#
####################################################
#                                                  #
#            -------Cloudflared-Mon-------         #
#                                                  #
####################################################
#
  cloudflared-mon:
    container_name: cloudflared-mon
    restart: $RESTART_POLICY
    hostname: cloudflared-mon
    environment:
      - CHECK_INTERVALS=10
      - NOTIFIERS=pover://$PUSHOVER_USER_KEY@$PUSHOVER_CLOUDFLARED_MON_API
      - CF_TOKEN=$CLOUDFLARED_MON_TOKEN
      - CF_EMAIL=$GM_USER
      - CF_ACCOUNT_ID=$ACCOUNT_ID
    volumes:
      - $PERSIST/cloudflared-mon:/app/db
    networks:
      my_bridge:
    image: 'techblog/cloudflared-mon:latest'
#
####################################################
#                                                  #
#                -------DashDot-------             #
#                                                  #
####################################################
#
  dashdot:
    container_name: dashdot
    restart: $RESTART_POLICY
    hostname: dashdot
    environment:
      - DASHDOT_SHOW_HOST=true
      #- DASHDOT_ENABLE_STORAGE_SPLIT_VIEW=true #all drives must be mounted in the container
      - DASHDOT_PAGE_TITLE=Mini-Tamimology Server Monitor
      #- DASHDOT_ACCEPT_OOKLA_EULA=true
      #- DASHDOT_USE_NETWORK_INTERFACE=bond0 # use (ifconfig -a | sed 's/[ \t].*//;/^$/d') in SSH
      - DASHDOT_ENABLE_CPU_TEMPS=true
      - DASHDOT_NETWORK_SPEED_AS_BYTES=true
      - DASHDOT_DISABLE_TILT=true
      - DASHDOT_DISABLE_HOST=true
    volumes:
      - /:/mnt/host:ro
    ports:
      - 7512:3001
    networks:
      my_bridge:
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    privileged: false
    image: 'mauricenino/dashdot:latest'
#
####################################################
#                                                  #
#           -------Databases-Backup-------         #
#                                                  #
####################################################
#
  databases-backup:
    container_name: databases-backup
    restart: $RESTART_POLICY
    hostname: databases-backup
    volumes:
      - $BACKUPS:/backup
      #- ./post-script.sh:/assets/custom-scripts/post-script.sh
    environment:
      - TIMEZONE=$TZ
      - USER_DBBACKUP=$PUID
      - GROUP_DBBACKUP=$PGID
      - CONTAINER_ENABLE_MONITORING=FALSE
      - LOG_PATH=/logs/logs
      - ENABLE_NOTIFICATIONS=true # only on job failure
      - NOTIFICATION_TYPE=email
      - MAIL_FROM=$GM_USER
      - MAIL_TO=$PUSHOVER_EMAIL_DATABASES_BACKUP
      - SMTP_HOST=$GM_HOST
      - SMTP_PORT=$GM_PORT

    # redis-backup
      - DB01_TYPE=redis
      - DB01_HOST=redisdb
      - DB01_PORT=6379
      - DB01_BACKUP_LOCATION=FILESYSTEM
      - DB01_FILESYSTEM_PATH=/backup/redis/
      - DB01_BACKUP_INTERVAL=1440 #once per day
      - DB01_BACKUP_BEGIN="2355" # @23:55 midnight
      - DB01_CLEANUP_TIME=8640 # keep for 6 days
      - DB01_CHECKSUM=SHA1
      - DB01_COMPRESSION=ZSTD
      - DB01_COMPRESSION_LEVEL=10
      - DB01_SPLIT_DB=false
      - DB01_MYSQL_SINGLE_TRANSACTION=true

    # mariadb-backup
      - DB02_TYPE=mariadb
      - DB02_HOST=mariadb
      - DB02_PORT=3306
      - DB02_NAME=mariadb-name
      - DB02_USER=mariadbuser
      - DB02_PASS=$DB_PASSWORD
      - DB02_BACKUP_LOCATION=FILESYSTEM
      - DB02_FILESYSTEM_PATH=/backup/mariadb/
      - DB02_BACKUP_INTERVAL=1440 #once per day
      - DB02_BACKUP_BEGIN="0000" # @00:00 midnight
      - DB02_CLEANUP_TIME=8640 # keep for 6 days
      - DB02_CHECKSUM=SHA1
      - DB02_COMPRESSION=ZSTD
      - DB02_COMPRESSION_LEVEL=10
      - DB02_SPLIT_DB=false
      - DB02_MYSQL_SINGLE_TRANSACTION=true

    # postgres-backup
      - DB03_TYPE=pgsql
      - DB03_HOST=postgresdb
      - DB03_USER=postgres-user
      - DB03_AUTH=postgres-user
      - DB03_PASS=$DB_PASSWORD
      - DB03_NAME=postgresdb
      - DB03_BACKUP_LOCATION=FILESYSTEM
      - DB03_FILESYSTEM_PATH=/backup/postgres/
      - DB03_SPLIT_DB=false
      - DB03_BACKUP_INTERVAL=1440 #once per day
      - DB03_BACKUP_BEGIN="0030" # @00:30 midnight
      - DB03_CLEANUP_TIME=8640 # keep for 6 days
      - DB03_COMPRESSION=ZSTD
      - DB03_COMPRESSION_LEVEL=10
      - DB03_CHECKSUM=SHA1
      - DB03_MYSQL_SINGLE_TRANSACTION=true

    networks:
      my_bridge:
    links:
      - redisdb
      - mariadb
      - postgresdb
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    image: 'tiredofit/db-backup:latest'
#
####################################################
#                                                  #
#                 -------DeGoog-------             #
#                                                  #
####################################################
#
  degoog:
    container_name: degoog
    hostname: degoog
    restart: $RESTART_POLICY
    volumes:
      - $PERSIST/degoog:/app/data
    ports:
      - 4444:4444
    networks:
      my_bridge:
    image: 'ghcr.io/fccview/degoog:latest'
#
####################################################
#                                                  #
#                -------Diun-------                #
#                                                  #
####################################################
#
  diun:
    container_name: diun
    restart: $RESTART_POLICY
    hostname: diun
    environment:
      - TZ=$TZ
      - LOG_LEVEL=info
      - LOG_JSON=false
    volumes:
      - $PERSIST/diun:/data
      - $PERSIST/diun/diun.yml:/diun.yml:ro
    networks:
      my_bridge:
    command: serve
    image: 'crazymax/diun:latest'
#
####################################################
#                                                  #
#                -------DockHand-------            #
#                                                  #
####################################################
#
  dockhand:
    container_name: dockhand
    hostname: dockhand
    restart: $RESTART_POLICY
    environment:
      TZ: $TZ
      DOCKER_HOST: $DOCKER_HOST
      DATABASE_URL: postgres://dockhand:$DB_PASSWORD@dockhand-postgres:5432/dockhand
    volumes:
      # - /var/run/docker.sock:/var/run/docker.sock
      - $PERSIST/dockhand/data:/app/data
    networks:
      my_bridge:
    ports:
      - 9000:3000
    depends_on:
      - dockhand-postgres
    image: 'fnsys/dockhand:latest'
#
####################################################
#                                                  #
#           -------DockHand-Postgres-------        #
#                                                  #
####################################################
#
  dockhand-postgres:
    container_name: dockhand-postgres
    hostname: dockhand-postgres
    restart: $RESTART_POLICY
    environment:
      POSTGRES_USER: dockhand
      POSTGRES_DB: dockhand
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - $PERSIST/dockhand/db:/var/lib/postgresql:rw
    networks:
      my_bridge:
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "dockhand", "-U", "dockhand"]
      timeout: 45s
      interval: 10s
      retries: 10
    image: 'postgres:18-alpine'
#
####################################################
#                                                  #
#                    DumbAssets                    #
#                                                  #
####################################################
#
  dumbassets:
    container_name: dumbassets
    restart: $RESTART_POLICY
    hostname: dumbassets
    environment:
      TZ: $TZ
      # NODE_ENV: production
      # DEBUG: true
      SITE_TITLE: DumbAssets
      # BASE_URL: http://localhost:3000
      # DUMBASSETS_PIN: 1234
      # ALLOWED_ORIGINS: '*'
      # APPRISE_URL: 
      CURRENCY_CODE: AUD
      CURRENCY_LOCALE: en-GB
    volumes:
      - $PERSIST/dumbassets:/app/data
    networks:
      my_bridge:
    ports: 
      - 3000:3000
    image: 'dumbwareio/dumbassets:latest'
#
####################################################
#                                                  #
#               -------ErsatzTV-------             #
#                                                  #
####################################################
#
  ersatztv:
    container_name: ersatztv
    hostname: ersatztv
    restart: $RESTART_POLICY
    environment:
      - TZ=$TZ
    ports:
      - 8409:8409
    networks:
      my_bridge:
    volumes:
      - $PERSIST/ersatztv:/config
      - $MEDIA_PATH:/media:ro
    tmpfs:
      - /transcode
    image: 'ghcr.io/ersatztv/legacy:latest'
#
####################################################
#                                                  #
#              -------ESPHome-------               #
#                                                  #
####################################################
#
  esphome:
    container_name: esphome
    restart: $RESTART_POLICY
    hostname: esphome
    privileged: true
    environment:
      - DEBUG=true
      - CLEANUP=false
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - ESPHOME_DASHBOARD_USE_PING=true
    ports:
      - 6052:6052/tcp
      - 6123:6123/tcp
    networks:
      my_bridge:
    volumes:
      - $PERSIST/esphome/:/config:rw
  #  devices:
  #   - /dev/ttyUSB0
    working_dir: /config
    image: 'esphome/esphome:latest'
#
####################################################
#                                                  #
#              -------ExcaliDraw-------            #
#                                                  #
####################################################
#
  excalidraw:
    container_name: excalidraw
    restart: $RESTART_POLICY
    hostname: excalidraw
    ports:
      - 3765:80
    networks:
      my_bridge:
    labels: 
      autoheal: $AUTOHEAL_RESTART
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
    stdin_open: true
    environment:
      - NODE_ENV=production
    image: 'excalidraw/excalidraw:latest'
#
####################################################
#                                                  #
#            -------FileBrowser-------             #
#                                                  #
####################################################
#
  filebrowser:
    container_name: filebrowser
    hostname: filebrowser
    restart: $RESTART_POLICY
    volumes:
      # - /:/host # Do not use a root "/" directory or include the "/var" folder
      - $PERSIST:/docker
      - $PERSIST/filebrowser/data:/home/filebrowser/data
      - $PERSIST/filebrowser/cache:/tmp  # Mount cache directory
      # - $PERSIST/filebrowser/config.yaml:/home/filebrowser/data/config.yaml # https://github.com/gtsteffaniak/filebrowser/blob/main/frontend/public/config.generated.yaml
    ports:
      - 7888:80
    networks:
      my_bridge:
    image: 'gtstef/filebrowser:stable'
#
####################################################
#                                                  #
#             -------FlareSolverr-------           #
#                                                  #
####################################################
#
  flaresolverr:
    container_name: flaresolverr
    hostname: flaresolverr
    restart: $RESTART_POLICY
    environment:
      - LOG_LEVEL=info
      - LOG_FILE=none
      - LOG_HTML=false
      - CAPTCHA_SOLVER=hcaptcha-solver #none
      - TZ=$TZ
    volumes:
      - $PERSIST/flaresolver:/config
    ports:
      - 8191:8191
    networks:
      my_bridge:
    image: 'ghcr.io/flaresolverr/flaresolverr:latest'
#
####################################################
#                                                  #
#             -------Grafana-------                #
#                                                  #
####################################################
#
  grafana:
    container_name: grafana
    restart: $RESTART_POLICY
    hostname: grafana
    environment: #You can do this with any of the configuration options in https://github.com/grafana/grafana/blob/main/conf/defaults.ini by setting GF_<SectionName>_<KeyName>__FILE to the path of the file holding the secret.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_FEATURE_TOGGLES_ENABLE=flameGraph
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      # - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=$GM_HOST:$GM_PORT
      - GF_SMTP_USER=$GM_USER
      - GF_SMTP_PASSWORD=$GM_PSW   # If the password contains # or ; you have to wrap it with triple quotes. Ex """#password;"""
      - GF_SMTP_FROM_NAME="Tamimology Server Grafana"
      - GF_EMAILS_WELCOME_EMAIL_ON_SIGN_UP=true
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_DOMAIN=grafana.$DOMAINNAME
      - GF_SERVER_ROOT_URL=%(protocol)ss://%(domain)s/
    user: '1000'    
    volumes:
      - $PERSIST/grafana:/var/lib/grafana
    ports:
      - 3003:3000
    networks:
      my_bridge:
    depends_on:
      - influxdb
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    image: 'grafana/grafana:latest'
#
####################################################
#                                                  #
#                 -------Gotify-------             #
#                                                  #
####################################################
#
  gotify:
    container_name: gotify
    hostname: gotify
    restart: $ALWAYS_ON_POLICY
    environment:
      - TZ=$TZ
      - GOTIFY_PLUGIN_DIR=/app/plugins
      - GOTIFY_DEFAULTUSER_NAME=admin
      - GOTIFY_DEFAULTUSER_PASS=$GOTIFY_USER_PASS
      # - GOTIFY_DATABASE_DIALECT=postgres
      # - GOTIFY_DATABASE_CONNECTION=host=gotify-postgres port=5432 user=gotify dbname=gotifydb password=$DB_PASSWORD sslmode=disable
      # - GOTIFY_DATABASE_DIALECT=postgres # sqlite3, mysql, postgres
      # - GOTIFY_DATABASE_CONNECTION=postgres=host=localhost port=5432 user=gotify dbname=gotifydb password=secret sslmode=disable
    volumes:
      - $PERSIST/gotify:/app/data
    networks:
      my_bridge:
    ports:
      - 9999:80
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    image: 'gotify/server:latest'
#
####################################################
#                                                  #
#                -------Homarr-------              #
#                                                  #
####################################################
#
  homarr:
    container_name: homarr
    restart: $RESTART_POLICY
    hostname: homarr
    environment:
      - TZ=$TZ
      - PASSWORD=$DASH_PWD
      - SECRET_ENCRYPTION_KEY$HOMARR_SECRET_ENCRYPTION_KEY # openssl rand -hex 32
      - DOCKER_HOSTNAMES=192.168.1.10,192.168.1.11,192.168.1.14
      - DOCKER_PORTS= 2375,2375,2375
      - DB_DRIVER=better-sqlite3
      - DB_URL=/appdata/db/db.sqlite
      - BASE_URL=https://homarr.$DOMAINNAME/
      # - DOCKER_HOST=$DOCKER_HOST
      - EDIT_MODE_PASSWORD=$DASH_PWD
      - DEFAULT_COLOR_SCHEME=dark
      # - DISABLE_EDIT_MODE=TRUE
    volumes:
      - $PERSIST/homarr/data:/appdata
    ports:
      - 7575:7575
    networks:
      tamimology_bridge:
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    image: 'ghcr.io/homarr-labs/homarr:latest'
#
####################################################
#                                                  #
#          -------Home Assistant-------            #
#                                                  #
####################################################
#
  homeassistant:
    container_name: homeassistant
    restart: $ALWAYS_ON_POLICY
    hostname: homeassistant
    privileged: true
    environment:
      - DOCKER_HOST=$SOCKET
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $LOCAL_TIME:/etc/localtime:ro
      - $PERSIST/homeassistant:/config:rw
      - $MEDIA_PATH:/config/media/synology:ro
      # - /run/dbus:/run/dbus:ro
    #devices:
    #  - /dev/ttyUSB0:/dev/ttyUSB0
    #  - /dev/ttyUSB1:/dev/ttyUSB1
    #  - /dev/ttyACM0:/dev/ttyACM0
    #  - /dev/bus/usb:/dev/bus/usb
    ports:
      - 8123:8123
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    healthcheck:
      test: curl -fSs http://127.0.0.1:8123 || exit 1
      start_period: 90s
      timeout: 10s
      interval: 5s
      retries: 3
    network_mode: host
    working_dir: /config
    depends_on:
      homeassistant-mariadb:
        condition: service_healthy
    image: 'ghcr.io/home-assistant/home-assistant:stable'
#
####################################################
#                                                  #
#                 -------Hauk-------               #
#                                                  #
####################################################
#
  hauk:
    container_name: hauk
    restart: $RESTART_POLICY
    hostname: hauk
    volumes:
      - $PERSIST/hauk:/etc/hauk:rw
    ports:
      - 9435:80
    networks:
      my_bridge:
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
    image: 'bilde2910/hauk:latest'
#
####################################################
#                                                  #
#     -------Immich Folder Album Creator-------    #
#                                                  #
####################################################
#
  immich-folder-album-creator:
    container_name: immich-folder-album-creator
    restart: $RESTART_POLICY
    hostname: immich-folder-album-creator
    environment:
      API_URL: http://192.168.1.10:8212/api
      API_KEY: $IMMICH_API
      ROOT_PATH: /mnt/photos
      CRON_EXPRESSION: "0 4 * * *" # Daily At 04:00, Immich scans library daily at 3am
      ALBUM_LEVELS: 2
      ALBUM_SEPARATOR: " - "
      MODE: CREATE
      DELETE_CONFIRM: True
      TZ: $TZ
      LOG_LEVEL: INFO
    networks:
      my_bridge:
    image: 'salvoxia/immich-folder-album-creator:latest'
#
####################################################
#                                                  #
#       -------Immich-Machine-Learning-------      #
#                                                  #
####################################################
#
  immich-machine-learning:
    container_name: immich-machine-learning
    restart: $ALWAYS_ON_POLICY
    hostname: immich-machine-learning
    environment:
      - IMMICH_ENV=production
      - IMMICH_LOG_LEVEL=log
    volumes:
      - $MEDIA_PATH/Photos/immich/cache:/cache
    networks:
      my_bridge:
    depends_on:
      immich-postgres:
        condition: service_started
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    image: 'ghcr.io/immich-app/immich-machine-learning:release'
#
####################################################
#                                                  #
#           -------Immich-Postgres-------          #
#                                                  #
####################################################
#
  immich-postgres:
    container_name: immich-postgres
    restart: $ALWAYS_ON_POLICY
    hostname: immich-postgres
    environment:
      TZ: $TZ
      POSTGRES_DB: immich
      POSTGRES_USER: immichuser
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - $PERSIST/immich/db:/var/lib/postgresql/data
    networks:
      my_bridge:
    labels: 
      com.centurylinklabs.watchtower.enable: false
      com.centurylinklabs.watchtower.monitor-only: true
    shm_size: 128mb
    image: 'ghcr.io/immich-app/postgres:16-vectorchord0.3.0-pgvectors0.3.0'
#
####################################################
#                                                  #
#            -------Immich-Redis-------            #
#                                                  #
####################################################
#
  immich-redis:
    container_name: immich-redis
    restart: $ALWAYS_ON_POLICY
    hostname: immich-redis
    environment:
      - TZ=$TZ
    volumes:
      - $PERSIST/immich/redis:/data
    networks:
      my_bridge:
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    # labels: 
    #   autoheal: $AUTOHEAL_RESTART
    #   monocker.enable: $MONOCKER_ENABLE
    image: 'redis:alpine'
#
####################################################
#                                                  #
#           -------Immich-Server-------            #
#                                                  #
####################################################
#
  immich:
    container_name: immich-server
    restart: $ALWAYS_ON_POLICY
    hostname: immich-server
    environment:
      - UPLOAD_LOCATION=./library
      - TZ=$TZ
      - IMMICH_ENV=production
      - IMMICH_LOG_LEVEL=log
      # # - UPLOAD_LOCATION=./albums
      - DB_DATA_LOCATION=./db
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=immichuser
      - DB_PASSWORD=$DB_PASSWORD
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - $MEDIA_PATH/Photos/immich/upload:/usr/src/app/upload
      - $MEDIA_PATH/Photos:/mnt/photos:ro
      - $LOCAL_TIME:/etc/localtime:ro
    ports:
      - 8212:2283
    networks:
      my_bridge:
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_started
      immich-machine-learning:
        condition: service_started
    healthcheck:
      disable: false
    # devices: # https://bhtechhub.com/how-to-check-gpu-on-linux/
    #   - /dev/dri:/dev/dri
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    image: 'ghcr.io/immich-app/immich-server:release'
#
####################################################
#                                                  #
#             -------InfluxDB-------               #
#                                                  #
####################################################
#
  influxdb:
    container_name: influxdb
    restart: $RESTART_POLICY
    hostname: influxdb
    ports:
        - 3004:8086
        - 8088:8088
      #  - 8083:8083
      #  - 8090:8090
    expose:
      - 8088
      # - 8125/udp
      # - 8092/udp
      # - 8094
    environment:
        - TZ=$TZ
        - DOCKER_INFLUXDB_INIT_MODE=setup
        - DOCKER_INFLUXDB_INIT_USERNAME=tam
        - DOCKER_INFLUXDB_INIT_PASSWORD=$DB_PASSWORD
        - DOCKER_INFLUXDB_INIT_ORG=Tamimology
        - DOCKER_INFLUXDB_INIT_BUCKET=homeassistant
        - INFLUXDB_BIND_ADDRESS=:8088
        # - V1_DB_NAME=homeassistantDB
        # - V1_RP_NAME=0
        # - V1_AUTH_USERNAME=tam
        # - V1_AUTH_PASSWORD=$DB_PASSWORD
    volumes:
        - $PERSIST/influxdb/data:/var/lib/influxdb2
        - $PERSIST/influxdb/config:/etc/influxdb2
        - $LOCAL_TIME:/etc/localtime:ro
    networks:
      my_bridge:
    image: 'influxdb:alpine'
#
####################################################
#                                                  #
#               -------Jellyfin-------             #
#                                                  #
####################################################
#
  jellyfin:
    container_name: jellyfin
    restart: $RESTART_POLICY
    hostname: jellyfin
    environment:
      - JELLYFIN_PublishedServerUrl=https://iptv.$DOMAINNAME  # Optional - alternative address used for autodiscovery
      - JELLYFIN_playlists:allowDuplicates=False
    volumes:
      - $PERSIST/jellyfin/config:/config
      - $PERSIST/jellyfin/cache:/cache
      # - $MEDIA_PATH:/media
      - type: bind
        source: $MEDIA_PATH
        target: /media
      # - type: bind
      #   source: /path/to/media2
      #   target: /media2
    ports:
      - 8096:8096
    networks:
       my_bridge:
    labels: 
      # autoheal: $AUTOHEAL_RESTART
      monocker.enable: $MONOCKER_ENABLE
    logging:
      driver: loki
      options:
        loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    # network_mode: 'host'
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
    user: $PUID:$PGID
    image: 'jellyfin/jellyfin:latest' 
#
####################################################
#                                                  #
#             JellySearch-MeiliSearch              #
#                                                  #
####################################################
#
  jellysearch-meilisearch:
    container_name: jellysearch-meilisearch
    restart: $RESTART_POLICY
    hostname: jellysearch-meilisearch
    environment:
      TZ: $TZ
      MEILI_MASTER_KEY: $JELLYSEARCH_MEILI_KEY
    volumes:
      - $PERSIST/jellyfin/jellysearch-meilisearch:/meili_data
    ports:
      - 7700:7700
    networks:
      my_bridge:
    image: 'getmeili/meilisearch:v1.33.0'
#
####################################################
#                                                  #
#              -------Karakeep-------              #
#                                                  #
####################################################
#
  karakeep:
    container_name: karakeep
    hostname: karakeep
    restart: $RESTART_POLICY
    environment:
      MEILI_ADDR: http://karakeep-meilisearch:7700
      MEILI_MASTER_KEY: $KARAKEEP_MEILI_KEY
      DATA_DIR: /data
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: $KARAKEEP_AUTH_SECRET
      # BROWSER_WEB_URL: http://chrome:9222 #USED FOR CRAWLING WEBSITES
      # OPENAI_API_KEY: ...
    volumes:
      - $PERSIST/karakeep:/data
    ports:
      - 3421:3000
    networks:
      my_bridge:
    depends_on:
      karakeep-meilisearch:
        condition: service_started
    image: 'ghcr.io/karakeep-app/karakeep:latest'
#
####################################################
#                                                  #
#        -------Karakeep-MeiliSearch-------        #
#                                                  #
####################################################
#
  karakeep-meilisearch:
    container_name: karakeep-meilisearch
    hostname: karakeep-meilisearch
    restart: $RESTART_POLICY
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - $PERSIST/karakeep/meilisearch:/meili_data
    networks:
      my_bridge:
    image: 'getmeili/meilisearch:v1.13.3'
#
####################################################
#                                                  #
#               -------Kavita------                #
#                                                  #
####################################################
#
  kavita:
    container_name: kavita
    restart: $ALWAYS_ON_POLICY
    hostname: kavita
    volumes:
        - $DOCUMENTS/books:/books     # ebooks should be in a folder named "library", Use as many as you want with different mapping on both sides
        - $PERSIST/kavita:/kavita/config
    environment:
        - TZ=$TZ
    ports:
        - 8778:5000
    networks:
        my_bridge:
    image: 'jvmilazz0/kavita:latest'    # Using the stable branch from the official dockerhub repo.
#
####################################################
#                                                  #
#                 -------Loki-------               #
#                                                  #
####################################################
#
  loki:
    container_name: loki
    restart: $RESTART_POLICY
    hostname: loki
    volumes:
      - $PERSIST/loki/config.yaml:/etc/loki/local-config.yaml
      - $PERSIST/loki/data:/data/loki
    ports:
      - 3002:3100
    networks:
      my_bridge:
    command: -config.file=/etc/loki/local-config.yaml
    image: 'grafana/loki:latest'
#
####################################################
#                                                  #
#            -------Manyfold-------                #
#                                                  #
####################################################
#
  manyfold:
    container_name: manyfold
    hostname: manyfold
    restart: $ALWAYS_ON_POLICY
    environment:
      REDIS_URL: redis://:$DB_PASSWORD@manyfold-redis:6379/1
      DATABASE_URL: postgresql://manyfolduser:$DB_PASSWORD@manyfold-postgres/manyfold?pool=5
      SECRET_KEY_BASE: $APP_KEY
      PUID: $PUID
      PGID: $PGID
      # RAILS_RELATIVE_URL_ROOT: /manyfold Sets the root of the app to /manyfold useful for reverse proxies with nginx
    volumes:
      - $PERSIST/manyfold/libraries:/models:rw
    ports:
      - 7214:3214
    networks:
      my_bridge:
    security_opt:
      - no-new-privileges:true
    depends_on:
      manyfold-redis:
        condition: service_healthy
      manyfold-postgres:
        condition: service_healthy
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=3dmodels"
      - "docktail.service.port=3214"  # CONTAINER port (RIGHT side of "8080:80")
      - "docktail.service.service-port=443"
    image: 'ghcr.io/manyfold3d/manyfold:latest'
#
####################################################
#                                                  #
#       -------Manyfold-Postgres-------            #
#                                                  #
####################################################
#
  manyfold-postgres:
    container_name: manyfold-postgres
    hostname: manyfold-postgres
    restart: $RESTART_POLICY
    environment:
      POSTGRES_DB: manyfold
      POSTGRES_USER: manyfolduser
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - $PERSIST/manyfold/db:/var/lib/postgresql:rw
    networks:
      my_bridge:
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "manyfold", "-U", "manyfolduser"]
      timeout: 45s
      interval: 10s
      retries: 10
    image: 'postgres:18-alpine'
#
####################################################
#                                                  #
#         -------Manyfold-Redis-------             #
#                                                  #
####################################################
#
  manyfold-redis:
    container_name: manyfold-redis
    hostname: manyfold-redis
    restart: $ALWAYS_ON_POLICY
    environment:
      TZ: $TZ
    volumes:
      - $PERSIST/manyfold/redis:/data:rw
    networks:
      my_bridge:
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass $DB_PASSWORD
    read_only: true
    user: $PUID:$PGID
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
    image: 'redis:alpine'
#
####################################################
#                                                  #
#                -------Maloja-------              #
#                                                  #
####################################################
#
  maloja:
    container_name: maloja
    restart: $RESTART_POLICY
    hostname: maloja
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - MALOJA_DATA_DIRECTORY=/data
      - MALOJA_FORCE_PASSWORD=$MALOJA_PWD
      - MALOJA_NAME=Tamimology Music
      - MALOJA_CHARTS_DISPLAY_TILES=true
      - MALOJA_DISPLAY_ART_ICONS=true
    volumes:
      - $PERSIST/maloja:/data
    networks:
      my_bridge:
    ports:
      - 42010:42010
    image: 'krateng/maloja:latest'
#
####################################################
#                                                  #
#              -------MariaDB-------               #
#                                                  #
####################################################
# 
  mariadb:
    container_name: mariadb
    restart: $ALWAYS_ON_POLICY
    hostname: mariadb
    environment: # https://mariadb.com/kb/en/mariadb-docker-environment-variables/
      MARIADB_ROOT_PASSWORD: $DB_PASSWORD
      # MARIADB_USER: homeassistant
      # MARIADB_PASSWORD: $DB_PASSWORD
      # MARIADB_DATABASE: homeassistant
      MARIADB_ROOT_HOST: 192.168.1.10
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DISABLE_UPGRADE_BACKUP: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
      # MYSQL_ROOT_PASSWORD: $DB_PASSWORD
      # MYSQL_USER: authelia
      # MYSQL_PASSWORD: $DB_PASSWORD
      # MYSQL_DATABASE: authelia
      # MYSQL_ROOT_USER: authelia
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
      # SKIP_INNODB: "yes" #only with jbergstroem/mariadb-alpine:latest, but not recommended
    volumes:
        - $PERSIST/mariadb:/var/lib/mysql
       #- $PERSIST/mariadb:/config # to be used with linuxserver image only
      #- $LOCAL_TIME:/etc/localtime:ro
      ##- $PERSIST/database.sql:/docker-entrypoint-initdb.d/schema.sql:ro   #same as running sudo docker exec -i [container_name] mysql --user=[User] --password=[Password] -h[Host] [db_name]<[mysql_file]
      #healthcheck:
       #test: ["CMD", "mysqladmin", "ping", "--silent"]
    ports:
      - 3306:3306
    networks:
      my_bridge:
    tty: true
    labels: 
      autoheal: $AUTOHEAL_RESTART
      autoheal.stop.timeout: 30
      monocker.enable: $MONOCKER_ENABLE  
    logging:
      driver: loki
      options:
        loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    # image: 'lscr.io/linuxserver/mariadb:10.6.13' #latest' #if using this image, remove all files/folders from /data to /data/databases
    image: 'jbergstroem/mariadb-alpine:latest' #10.6.13'
#
####################################################
#                                                  #
#               -------Monocker-------             #
#                                                  #
####################################################
#
  monocker:
    container_name: monocker
    restart: $RESTART_POLICY
    hostname: monocker
    environment:
      DOCKER_HOST: $DOCKER_HOST
      MESSAGE_PLATFORM: 'pushover@$PUSHOVER_USER_KEY@$PUSHOVER_MONOCKER_API'
      LABEL_ENABLE: 'true'
      # Optional label to preface messages. Handy if you are running multiple versions of Monocker
      SERVER_LABEL: 'Mini-PC'
      ONLY_OFFLINE_STATES: 'false'
      EXCLUDE_EXITED: 'false'      
      # [Optional] - Set the poll period in seconds. Defaults to 10 seconds, which is also the minimum. 
      PERIOD: 30
    # volumes:
    #   - $DOCKER_SOCKET:/var/run/docker.sock:ro
    networks:
      my_bridge:
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    image: 'petersem/monocker:latest'
#
####################################################
#                                                  #
#               -------Mozhi-------                #
#                                                  #
####################################################
#
  mozhi:
    container_name: mozhi
    restart: $RESTART_POLICY
    hostname: mozhi
    ports:
      - 6455:3000
    networks:
      my_bridge: 
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/version || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    labels: 
      monocker.enable: $MONOCKER_ENABLE  
    image: 'codeberg.org/aryak/mozhi:latest'
#
####################################################
#                                                  #
#                      MQTT                        #
#                                                  #
####################################################
#
  mqtt:
    container_name: mqtt
    restart: $RESTART_POLICY
    hostname: mqtt
    volumes:
      - $PERSIST/mqtt/config:/mosquitto/config
      - $PERSIST/mqtt/data:/mosquitto/data
      - $PERSIST/mqtt/log:/mosquitto/log
      - $PERSIST/mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - 1883:1883
      - 9001:9001
    # network_mode: "host"
    networks:
      my_bridge:
    # healthcheck:
    #   test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-i", "docker_health_check", "-C", "1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    labels: 
      monocker.enable: $MONOCKER_ENABLE
    image: 'eclipse-mosquitto:latest'
#
####################################################
#                                                  #
#               -------NaviDrome-------            #
#                                                  #
####################################################
#
  navidrome:
    container_name: navidrome
    restart: $ALWAYS_ON_POLICY
    hostname: navidrome
    environment:
      ND_SCANSCHEDULE: 1h
      ND_AUTHREQUESTLIMIT: 5
      ND_AUTHWINDOWLENGTH: 30s
      ND_LASTFM_ENABLED: false
      ND_ENABLEEXTERNALSERVICES: true
      ND_LISTENBRAINZ_ENABLED: true
      ND_LISTENBRAINZ_BASEURL: http://$LOCAL_HOST:42010/apis/listenbrainz/1/
      ND_LISTENBRAINZ_APIKEY: $LISTENBRAINZ_APIKEY
    #   ND_LOGLEVEL: info  
    #   ND_SESSIONTIMEOUT: 24h
    #   ND_BASEURL: ""
    volumes:
      - $PERSIST/navidrome:/data
      - $MEDIA_PATH/Music:/music:ro
    ports:
      - 4533:4533
    networks:
      my_bridge:
    labels: 
      autoheal: $AUTOHEAL_RESTART
      monocker.enable: $MONOCKER_ENABLE
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    user: 1035:$PGID # should be owner of volumes
    image: 'ghcr.io/navidrome/navidrome:latest'
#
####################################################
#                                                  #
#               -------NetAlertX-------            #
#                                                  #
####################################################
#
  netalertx:  
    container_name: netalertx
    restart: $ALWAYS_ON_POLICY
    hostname: netalertx
    environment:
      - TZ=$TZ
      - PORT=20211
      - HOST_USER_ID=$PUID
      - HOST_USER_GID=$PGID
    volumes:
      - $PERSIST/netalertx:/app/config
      - $PERSIST/netalertx/app.db:/app/db/app.db
      - $PERSIST/netalertx/logs:/app/front/log
    network_mode: host
    labels: 
      autoheal: $AUTOHEAL_RESTART
      monocker.enable: $MONOCKER_ENABLE
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: curl -f http://localhost:20211/ || exit 1
    image: 'jokobsk/netalertx:latest'
#
####################################################
#                                                  #
#               -------NextCloud-------            #
#                                                  #
####################################################
#
  nextcloud:
    container_name: nextcloud
    restart: $RESTART_POLICY
    hostname: nextcloud
    environment:
      # - NEXTCLOUD_ADMIN_USER=admin
      # - NEXTCLOUD_ADMIN_PASSWORD=$DB_PASSWORD
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=192.168.1.11 nextcloud.$DOMAINNAME # 192.168.1.18
      - TRUSTED_PROXIES=192.168.1.11 nextcloud.$DOMAINNAME
      - OVERWRITEHOST=nextcloud.$DOMAINNAME
      - OVERWRITEPROTOCOL=https
      - MYSQL_PASSWORD=$DB_PASSWORD
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextclouduser
      - MYSQL_HOST=nextcloud-mariadb
      - SMTP_HOST=$GM_HOST
      - SMTP_SECURE=ssl
      - SMTP_PORT=$GM_PORT
      - SMTP_AUTHTYPE=LOGIN
      - SMTP_NAME=$GM_USER
      - SMTP_PASSWORD=$GM_PSW
      - MAIL_FROM_ADDRESS=$GM_USER_MAIL
      - MAIL_DOMAIN=gmail.com
    volumes:
      - $PERSIST/nextcloud/config:/var/www/html:rw
    ports:
      - 8082:80
    networks:
      my_bridge:
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
    depends_on:
      nextcloud-mariadb:
        condition: service_started
      nextcloud-redis:
        condition: service_healthy
      nextcloud-cron:
        condition: service_started
    image: 'nextcloud:latest'
#
####################################################
#                                                  #
#            -------NextCloud-Cron-------          #
#                                                  #
####################################################
#
  nextcloud-cron:
    container_name: nextcloud-cron
    restart: $ALWAYS_ON_POLICY
    hostname: nextcloud-redis
    volumes:
      - $PERSIST/nextcloud/config:/var/www/html:rw
    networks:
      my_bridge:
    entrypoint: /cron.sh
    depends_on:
      nextcloud-mariadb:
        condition: service_started
      nextcloud-redis:
        condition: service_started
    image: 'nextcloud:apache'
#
####################################################
#                                                  #
#          -------NextCloud-MariaDB-------         #
#                                                  #
####################################################
#
  nextcloud-mariadb:
    container_name: nextcloud-mariadb
    restart: $RESTART_POLICY
    hostname: nextcloud-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=$DB_PASSWORD
      - MYSQL_PASSWORD=$DB_PASSWORD
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextclouduser
      - TZ=$TZ
    volumes:
      - $PERSIST/nextcloud/db:/var/lib/mysql:rw
    networks:
      my_bridge:
    user: $PUID:$PGID
    security_opt:
      - no-new-privileges:false
    command: --transaction-isolation=READ-COMMITTED
    image: 'mariadb:lts'
#
####################################################
#                                                  #
#           -------NextCloud-Redis-------          #
#                                                  #
####################################################
#
  nextcloud-redis:
    container_name: nextcloud-redis
    restart: $ALWAYS_ON_POLICY
    hostname: nextcloud-redis
    environment:
      TZ: $TZ
    volumes:
      - $PERSIST/nextcloud/redis:/data:rw
    expose:
      - 6379
    networks:
      my_bridge:
    user: $PUID:$PGID
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
    image: 'redis:alpine'
#
####################################################
#                                                  #
#              -------OctoPrint-------             #
#                                                  #
####################################################
#
  octoprint:
    container_name: octoprint
    hostname: octoprint
    restart: $RESTART_POLICY
    # uncomment the lines below to ensure camera streaming is enabled when you add a video device
    #environment:
    #  - ENABLE_MJPG_STREAMER=true
    volumes:
      - $PERSIST/octoprint:/octoprint
    networks:
      my_bridge:
    ports:
      - 3015:80
    devices:
    # use `python3 -m serial.tools.miniterm` to see what the name is of the printer, this requires pyserial
      - /dev/ttyUSB0:/dev/ttyUSB0
    #  - /dev/video0:/dev/video0
    labels: 
      com.centurylinklabs.watchtower.enable: false
      com.centurylinklabs.watchtower.monitor-only: true
      dev.quenary.tugtainer.protected: True
    image: 'octoprint/octoprint:latest'
#
####################################################
#                                                  #
#              -------PairDrop-------              #
#                                                  #
####################################################
#
  pairdrop:
    container_name: pairdrop
    hostname: pairdrop
    restart: $RESTART_POLICY
    environment:
        - PUID=$PUID
        - PGID=$PGID
        - WS_FALLBACK=false # Set to true to enable websocket fallback if the peer to peer WebRTC connection is not available to the client.
        - RATE_LIMIT=false # Set to true to limit clients to 1000 requests per 5 min.
        - RTC_CONFIG=/config/rtc_config.json #false # Set to the path of a file that specifies the STUN/TURN servers.
        - DEBUG_MODE=false # Set to true to debug container and peer connections.
        - TZ=$TZ
    volumes:
      - $PERSIST/pairdrop:/config
    ports:
        - 3005:3000
    networks:
      my_bridge:
    image: 'lscr.io/linuxserver/pairdrop:latest'
#
####################################################
#                                                  #
#            -------Paperless-NGX-------           #
#                                                  #
####################################################
#
  paperless-ngx:
    container_name: paperless-ngx
    restart: $RESTART_POLICY
    hostname: paperless-ngx
    environment:
      PAPERLESS_REDIS: redis://:$DB_PASSWORD@paperless-ngx-redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-ngx-postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: $DB_PASSWORD 
      PAPERLESS_TRASH_DIR: ../trash
      PAPERLESS_FILENAME_FORMAT: '{created_year}/{document_type}/{title}'
      PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD: 6
      PAPERLESS_TASK_WORKERS: 1
      USERMAP_UID: $PUID
      USERMAP_GID: $PGID
      PAPERLESS_TIME_ZONE: $TZ
      PAPERLESS_ADMIN_USER: tam
      PAPERLESS_ADMIN_PASSWORD: $PAPERLESS_PWD
      PAPERLESS_URL: https://documents.tamimology.com
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://documents.tamimology.com
      PAPERLESS_OCR_LANGUAGES: ara eng # check what is installed by  sudo docker exec -it paperless-ngx tesseract --list-langs
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-ngx-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-ngx-tika:9998
      PAPERLESS_EMAIL_HOST: $GM_HOST
      PAPERLESS_EMAIL_PORT: $GM_PORT
      PAPERLESS_EMAIL_HOST_USER: $GM_USER
      PAPERLESS_EMAIL_FROM: $GM_USER
      PAPERLESS_EMAIL_HOST_PASSWORD: $GM_PSW
      PAPERLESS_EMAIL_USE_SSL: true
    volumes:
      - $PERSIST/paperless-ngx/data:/usr/src/paperless/data:rw
      - $DOCUMENTS:/usr/src/paperless/media:rw
      - $PERSIST/paperless-ngx/export:/usr/src/paperless/export:rw
      - $PERSIST/paperless-ngx/consume:/usr/src/paperless/consume:rw
      - $PERSIST/paperless-ngx/trash:/usr/src/paperless/trash:rw
    ports:
      - 8777:8000
    networks:
      my_bridge:
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      paperless-ngx-postgres:
        condition: service_healthy
      paperless-ngx-redis:
        condition: service_healthy
      paperless-ngx-tika:
        condition: service_started
      paperless-ngx-gotenberg:
        condition: service_started
    image: 'ghcr.io/paperless-ngx/paperless-ngx:latest'
#
####################################################
#                                                  #
#       -------Paperless-NGX--Gotenberg-------     #
#                                                  #
####################################################
#
  paperless-ngx-gotenberg:
    container_name: paperless-ngx-gotenberg
    restart: $RESTART_POLICY
    hostname: paperless-ngx-gotenberg
    networks:
      my_bridge:
    user: $PUID:$PGID
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    image: 'gotenberg/gotenberg:latest'
#
####################################################
#                                                  #
#        -------Paperless-NGX-Postgres-------      #
#                                                  #
####################################################
#
  paperless-ngx-postgres:
    container_name: paperless-ngx-postgres
    hostname: paperless-ngx-postgres
    restart: $RESTART_POLICY
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - $PERSIST/paperless-ngx/db:/var/lib/postgresql/data:rw
    networks:
      my_bridge:
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "paperless", "-U", "paperless"]
      timeout: 45s
      interval: 10s
      retries: 10
    image: 'postgres:16-alpine'
#
####################################################
#                                                  #
#         -------Paperless-NGX-Redis-------        #
#                                                  #
####################################################
#
  paperless-ngx-redis:
    restart: $RESTART_POLICY
    container_name: paperless-ngx-redis
    hostname: paperless-ngx-redis
    environment:
      TZ: $TZ
    volumes:
      - $PERSIST/paperless-ngx/redis:/data:rw
    networks:
      my_bridge:
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass $DB_PASSWORD
    read_only: true
    user: $PUID:$PGID
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
    image: 'redis:alpine'
#
####################################################
#                                                  #
#          -------Paperless-NGX-Tika-------        #
#                                                  #
####################################################
#
  paperless-ngx-tika:
    restart: $RESTART_POLICY
    container_name: paperless-ngx-tika
    hostname: paperless-ngx-tika
    networks:
      my_bridge:
    user: $PUID:$PGID
    image: 'docker.io/apache/tika:latest'
#
####################################################
#                                                  #
#               -------PasteFy-------              #
#                                                  #
####################################################
#
  pastefy:
    container_name: pastefy
    restart: $RESTART_POLICY
    hostname: pastefy
    environment:
      HTTP_SERVER_PORT: 80
      HTTP_SERVER_CORS: "*"
      DATABASE_DRIVER: mysql
      DATABASE_NAME: pastefy
      DATABASE_USER: pastefy
      DATABASE_PASSWORD: $DB_PASSWORD
      DATABASE_HOST: mariadb
      DATABASE_PORT: 3306
      SERVER_NAME: https://pastefy.$DOMAINNAME
      AUTH_PROVIDER: $PROVIDER
      OAUTH2_INTERAAPPS_CLIENT_ID: $CLIENT_ID
      OAUTH2_INTERAAPPS_CLIENT_SECRET: $CLIENT_SECRET
      PASTEFY_INFO_CUSTOM_NAME: Tamimology Home Server
      PASTEFY_INFO_CUSTOM_FOOTER: Tam HAJAR 2021
      #PASTEFY_INFO_CUSTOM_LOGO: https://urltoimage
      PASTEFY_LOGIN_REQUIRED: false
      PASTEFY_LOGIN_REQUIRED_CREATE: true
      PASTEFY_LOGIN_REQUIRED_READ: false
      PASTEFY_ENCRYPTION_DEFAULT: false
    ports:
      - 9980:80
    networks:
      my_bridge:
    depends_on:
      pastefy-mariadb:
        condition: service_healthy
    image: "interaapps/pastefy:latest"
#
####################################################
#                                                  #
#          -------PasteFy-MariaDB-------           #
#                                                  #
####################################################
#
  pastefy-mariadb:
    container_name: pastefy-mariadb
    restart: $ALWAYS_ON_POLICY
    hostname: pastefy-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: $DB_PASSWORD
      MARIADB_ROOT_HOST: 192.168.1.10
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DISABLE_UPGRADE_BACKUP: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
      # SKIP_INNODB: "yes" #only with jbergstroem/mariadb-alpine:latest, but not recommended
    volumes:
        - $PERSIST/pastefy/db:/var/lib/mysql
    networks:
      my_bridge:
    tty: true
    labels: 
      autoheal: $AUTOHEAL_RESTART
      autoheal.stop.timeout: 30
      monocker.enable: $MONOCKER_ENABLE  
    image: 'jbergstroem/mariadb-alpine:latest'
#
####################################################
#                                                  #
#                -------PeaNUT-------              #
#                                                  #
####################################################
#
  peanut:
    container_name: peanut
    hostname: peanut
    restart: $RESTART_POLICY
    environment:
      - NUT_HOST=192.168.1.11
      - NUT_PORT=3493
      - WEB_PORT=8080
      - WEB_USERNAME=admin
      - WEB_PASSWORD=$PEANUT_PWD
    volumes:
      - $PERSIST/peanut:/config
    networks:
      my_bridge:
    ports:
      - 8999:8080
    user: $PUID:$PGID
    image: 'brandawg93/peanut:latest'
#
####################################################
#                                                  #
#            -------Portainer-EE-------            #
#                                                  #
####################################################
#
  portainer:
    container_name: portainer-ee
    restart: $ALWAYS_ON_POLICY
    hostname: portainer
    privileged: true
    command: -H $DOCKER_HOST --tlsskipverify
    # command: ["--admin-password=${PASSWORD}"]
    environment:
      DOCKER_HOST: $SOCKET
      TZ: $TZ
    volumes:
      - $DOCKER_SOCKET:/var/run/docker.sock
      - $PERSIST/portainer:/data
    ports:
      - 8000:8000
      - 9000:9000
      - 9443:9443
    networks:
      my_bridge:
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: "http://$LOCAL_HOST:3002/loki/api/v1/push"
    image: 'portainer/portainer-ee:alpine-sts'
#
####################################################
#                                                  #
#              -------ProjectSend-------           #
#                                                  #
####################################################
#
  projectsend:
    container_name: projectsend
    restart: $RESTART_POLICY
    hostname: projectsend
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - MAX_UPLOAD=20000
      - MYSQL_DATABASE=projectsend
      - MYSQL_USER=projectsend
      - MYSQL_PASSWORD=$DB_PASSWORD
    volumes:
      - $PERSIST/projectsend/config:/config
      - $PERSIST/projectsend/data:/data
    ports:
      - 8516:80
    networks:
      my_bridge:
    depends_on:
      projectsend-mariadb:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
    image: 'lscr.io/linuxserver/projectsend:latest'
#
####################################################
#                                                  #
#        -------ProjectSend-MariaDB-------         #
#                                                  #
####################################################
#
  projectsend-mariadb:
    container_name: projectsend-mariadb
    restart: $ALWAYS_ON_POLICY
    hostname: projectsend-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: $DB_PASSWORD
      MARIADB_ROOT_HOST: 192.168.1.10
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DISABLE_UPGRADE_BACKUP: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
      # SKIP_INNODB: "yes" #only with jbergstroem/mariadb-alpine:latest, but not recommended
    volumes:
        - $PERSIST/projectsend/db:/var/lib/mysql
    networks:
      my_bridge:
    tty: true
    labels: 
      monocker.enable: $MONOCKER_ENABLE  
    image: 'jbergstroem/mariadb-alpine:latest'
#
####################################################
#                                                  #
#               -------Promtail-------             #
#                                                  #
####################################################
#
  promtail:
    container_name: promtail
    restart: $RESTART_POLICY
    hostname: promtail
    volumes:
      - $PERSIST/promtail/config.yml:/etc/promtail/config.yml
      # - /volume1/@docker/containers:/var/lib/docker/containers:ro
      # - /var/log:/var/log
    networks:
      my_bridge:
    depends_on:
      - loki
        # condition: service_started
    command: -config.file=/etc/promtail/config.yml
    image: 'grafana/promtail:latest'
#
####################################################
#                                                  #
#             -------Prowlarr-------               #
#                                                  #
####################################################
#
  prowlarr:
    container_name: prowlarr
    restart: $RESTART_POLICY
